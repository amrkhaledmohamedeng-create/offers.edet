<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم همسه للسياحة</title>
<meta name="robots" content="noindex, nofollow">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
:root{--green:#23418A;--green2:#2F63AE;--gold:#FACA12;--ink:#16244A;--muted:#64708A;--bg:#F4F7FF;}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--green);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{font-size:18px;margin:0}
.container{max-width:1100px;margin:24px auto;padding:0 16px}
.btn{border:none;border-radius:10px;padding:10px 18px;font-weight:800;cursor:pointer;font-family:inherit}
.btn-gold{background:var(--gold);color:var(--ink)}
.btn-green{background:var(--green2);color:#fff}
.btn-danger{background:#c0392b;color:#fff}
.btn-light{background:#fff;color:var(--green);border:1px solid #d7dde5}
.card{background:#fff;border:1px solid #dce5f7;border-radius:14px;padding:20px;box-shadow:0 6px 18px #0000000d}
.login-box{max-width:380px;margin:80px auto;text-align:center}
.login-box input{width:100%;padding:12px;border-radius:10px;border:1px solid #d7dde5;margin:10px 0;font:inherit}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:30px;background:#fff;border:1px solid #d7dde5;cursor:pointer;font-weight:700}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
.offer-list{display:grid;gap:14px}
.offer{border:1px solid #dce5f7;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;background:#fff}
.offer.inactive{opacity:.55}
.offer .info b{display:block;font-size:16px;color:var(--green)}
.offer .info span{font-size:13px;color:var(--muted)}
.offer .actions{display:flex;gap:6px;flex-shrink:0}
.offer .actions button{padding:6px 12px;font-size:13px;border-radius:8px}
.modal-overlay{position:fixed;inset:0;background:#00000066;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin-top:0;color:var(--green)}
.form-row{margin-bottom:12px}
.form-row label{display:block;font-weight:700;margin-bottom:5px;font-size:14px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #d7dde5;font:inherit}
.form-actions{display:flex;gap:10px;margin-top:14px}
.msg{padding:10px 14px;border-radius:10px;font-weight:700;margin-bottom:14px;display:none}
.msg.show{display:block}
.msg.success{background:#e9f8ef;color:#176b3a}
.msg.error{background:#fff0f0;color:#a12626}
.empty{color:var(--muted);text-align:center;padding:30px}
.top-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.small{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div id="loginScreen" class="login-box">
  <div class="card">
    <h2>لوحة تحكم همسه</h2>
    <p class="small">أدخل رابط سكريبت جوجل ومفتاح الدخول الإداري</p>
    <div class="form-row" style="text-align:right">
      <label>رابط Apps Script (ينتهي بـ /exec)</label>
      <input id="scriptUrlInput" type="text" placeholder="https://script.google.com/macros/s/xxxxx/exec">
    </div>
    <div class="form-row" style="text-align:right">
      <label>مفتاح الدخول الإداري</label>
      <input id="keyInput" type="password" placeholder="ADMIN_KEY">
    </div>
    <div id="loginMsg" class="msg"></div>
    <button class="btn btn-gold" style="width:100%" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="dashboard" style="display:none">
  <header>
    <h1>لوحة تحكم عروض همسه للسياحة</h1>
    <button class="btn btn-light" onclick="doLogout()">خروج</button>
  </header>
  <div class="container">
    <div class="top-actions">
      <div class="tabs">
        <div class="tab active" data-section="" onclick="setSection('',this)">الكل</div>
        <div class="tab" data-section="umrah" onclick="setSection('umrah',this)">العمرة</div>
        <div class="tab" data-section="hajj" onclick="setSection('hajj',this)">الحج</div>
        <div class="tab" data-section="cash" onclick="setSection('cash',this)">عمرة الكاش</div>
      </div>
      <button class="btn btn-green" onclick="openModal()">+ إضافة عرض جديد</button>
    </div>
    <div id="dashMsg" class="msg"></div>
    <div class="card">
      <div id="offerList" class="offer-list"><div class="empty">جاري التحميل...</div></div>
    </div>
    <p class="small" style="margin-top:14px">ملحوظة: التبويب "الكل" يعرض حتى العروض المخفية (غير المفعّلة) عشان تقدر تراجعها أو تعيد تفعيلها.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">إضافة عرض جديد</h3>
    <form id="offerForm">
      <input type="hidden" id="offerId">
      <div class="form-row">
        <label>القسم *</label>
        <select id="fSection" required>
          <option value="umrah">العمرة</option>
          <option value="hajj">الحج</option>
          <option value="cash">عمرة الكاش</option>
        </select>
      </div>
      <div class="form-row"><label>العنوان *</label><input id="fTitle" required placeholder="مثال: عمرة التيسير"></div>
      <div class="form-row"><label>وصف قصير</label><input id="fSubtitle" placeholder="مثال: ابدأ من 1,000 جنيه"></div>
      <div class="form-row">
        <label>تفاصيل العرض (كل نقطة في سطر)</label>
        <textarea id="fItems" rows="4" placeholder="1000 جنيه × 24 شهر
2000 جنيه × 12 شهر"></textarea>
      </div>
      <div class="form-row"><label>نص السعر / الشريط الملون</label><input id="fPrice" placeholder="مثال: ابدأ من 1,000 جنيه"></div>
      <div class="form-row"><label>رابط صورة (اختياري)</label><input id="fImage" placeholder="https://..."></div>
      <div class="form-row"><label>ترتيب الظهور (رقم، الأصغر يظهر أولًا)</label><input id="fOrder" type="number" value="1"></div>
      <div class="form-row">
        <label>الحالة</label>
        <select id="fActive"><option value="نعم">مفعّل (يظهر في الموقع)</option><option value="لا">مخفي</option></select>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-green" style="flex:1">حفظ</button>
        <button type="button" class="btn btn-light" onclick="closeModal()">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script>
let SCRIPT_URL = localStorage.getItem('hamsa_script_url') || '';
let ADMIN_KEY = sessionStorage.getItem('hamsa_admin_key') || '';
let currentOffers = [];
let currentSection = '';

const loginScreen = document.getElementById('loginScreen');
const dashboard = document.getElementById('dashboard');
const loginMsg = document.getElementById('loginMsg');
const dashMsg = document.getElementById('dashMsg');

if(SCRIPT_URL) document.getElementById('scriptUrlInput').value = SCRIPT_URL;

function showMsg(el,text,type){
  el.textContent = text;
  el.className = 'msg show ' + (type||'');
}

async function doLogin(){
  const url = document.getElementById('scriptUrlInput').value.trim();
  const key = document.getElementById('keyInput').value.trim();
  if(!url || !key){ showMsg(loginMsg,'من فضلك أدخل الرابط والمفتاح','error'); return; }
  SCRIPT_URL = url.replace(/\/+$/,'');
  ADMIN_KEY = key;
  try{
    const res = await fetch(`${SCRIPT_URL}?action=offersAdmin&key=${encodeURIComponent(ADMIN_KEY)}`);
    const data = await res.json();
    if(!data.ok){ showMsg(loginMsg, data.error || 'تعذر تسجيل الدخول', 'error'); return; }
    localStorage.setItem('hamsa_script_url', SCRIPT_URL);
    sessionStorage.setItem('hamsa_admin_key', ADMIN_KEY);
    currentOffers = data.offers || [];
    loginScreen.style.display='none';
    dashboard.style.display='block';
    renderOffers();
  }catch(err){
    showMsg(loginMsg,'تعذر الاتصال بالسيرفر، تأكد من الرابط','error');
  }
}

function doLogout(){
  sessionStorage.removeItem('hamsa_admin_key');
  ADMIN_KEY='';
  dashboard.style.display='none';
  loginScreen.style.display='block';
}

async function reloadOffers(){
  const res = await fetch(`${SCRIPT_URL}?action=offersAdmin&key=${encodeURIComponent(ADMIN_KEY)}`);
  const data = await res.json();
  if(data.ok){ currentOffers = data.offers || []; renderOffers(); }
  else showMsg(dashMsg, data.error||'خطأ في التحميل', 'error');
}

function setSection(sec, el){
  currentSection = sec;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderOffers();
}

function renderOffers(){
  const list = document.getElementById('offerList');
  const items = currentSection ? currentOffers.filter(o=>o.section===currentSection) : currentOffers;
  if(!items.length){ list.innerHTML = '<div class="empty">لا يوجد عروض في هذا القسم بعد</div>'; return; }
  list.innerHTML = items.map(o=>`
    <div class="offer ${o.active==='نعم'?'':'inactive'}">
      <div class="info">
        <b>${escapeHtml(o.title)} ${o.active!=='نعم'?'(مخفي)':''}</b>
        <span>${escapeHtml(o.subtitle||'')} — القسم: ${sectionLabel(o.section)} — ترتيب: ${o.order}</span>
      </div>
      <div class="actions">
        <button class="btn btn-light" onclick='editOffer(${JSON.stringify(o.id)})'>تعديل</button>
        <button class="btn btn-danger" onclick='deleteOffer(${JSON.stringify(o.id)})'>حذف</button>
      </div>
    </div>
  `).join('');
}

function sectionLabel(s){
  return s==='umrah'?'العمرة':s==='hajj'?'الحج':s==='cash'?'عمرة الكاش':s;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function openModal(){
  document.getElementById('modalTitle').textContent='إضافة عرض جديد';
  document.getElementById('offerForm').reset();
  document.getElementById('offerId').value='';
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function editOffer(id){
  const o = currentOffers.find(x=>x.id===id);
  if(!o) return;
  document.getElementById('modalTitle').textContent='تعديل العرض';
  document.getElementById('offerId').value=o.id;
  document.getElementById('fSection').value=o.section;
  document.getElementById('fTitle').value=o.title;
  document.getElementById('fSubtitle').value=o.subtitle;
  document.getElementById('fItems').value=(o.items||[]).join('\n');
  document.getElementById('fPrice').value=o.price;
  document.getElementById('fImage').value=o.image;
  document.getElementById('fOrder').value=o.order;
  document.getElementById('fActive').value=o.active==='نعم'?'نعم':'لا';
  document.getElementById('modalOverlay').classList.add('show');
}

async function deleteOffer(id){
  if(!confirm('هل أنت متأكد من حذف هذا العرض؟')) return;
  const body = new URLSearchParams({action:'deleteOffer', key:ADMIN_KEY, id});
  const res = await fetch(SCRIPT_URL, {method:'POST', body});
  const data = await res.json();
  if(data.ok){ showMsg(dashMsg,'تم حذف العرض','success'); reloadOffers(); }
  else showMsg(dashMsg, data.error||'تعذر الحذف','error');
}

document.getElementById('offerForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const id = document.getElementById('offerId').value.trim();
  const items = document.getElementById('fItems').value.split('\n').map(s=>s.trim()).filter(Boolean).join('|');
  const payload = {
    key: ADMIN_KEY,
    action: id ? 'updateOffer' : 'addOffer',
    id: id,
    section: document.getElementById('fSection').value,
    title: document.getElementById('fTitle').value.trim(),
    subtitle: document.getElementById('fSubtitle').value.trim(),
    items: items,
    price: document.getElementById('fPrice').value.trim(),
    image: document.getElementById('fImage').value.trim(),
    order: document.getElementById('fOrder').value || '1',
    active: document.getElementById('fActive').value
  };
  const body = new URLSearchParams(payload);
  try{
    const res = await fetch(SCRIPT_URL, {method:'POST', body});
    const data = await res.json();
    if(data.ok){
      showMsg(dashMsg, id?'تم تعديل العرض':'تم إضافة العرض','success');
      closeModal();
      reloadOffers();
    }else{
      showMsg(dashMsg, data.error||'حدث خطأ','error');
    }
  }catch(err){
    showMsg(dashMsg,'تعذر الاتصال بالسيرفر','error');
  }
});

// دخول تلقائي لو الرابط والمفتاح محفوظين بالفعل
if(SCRIPT_URL && ADMIN_KEY){
  fetch(`${SCRIPT_URL}?action=offersAdmin&key=${encodeURIComponent(ADMIN_KEY)}`)
    .then(r=>r.json())
    .then(data=>{
      if(data.ok){
        currentOffers = data.offers || [];
        loginScreen.style.display='none';
        dashboard.style.display='block';
        renderOffers();
      }
    }).catch(()=>{});
}
</script>
</body>
</html>
