<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تعديل العروض | همسه للسياحة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--green:#23418A;--gold:#FACA12;--dark:#152A63;--ink:#16244A;--muted:#64708A;--line:#DCE5F7}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Arial,sans-serif;background:#F4F7FF;color:var(--ink)}
header{background:var(--dark);color:#fff;padding:16px 0;border-bottom:3px solid var(--gold)}
.container{width:min(1100px,94%);margin:auto}
header .container{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0}
.btn{padding:10px 18px;border-radius:10px;font-weight:800;border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:14px}
.btn-gold{background:var(--gold);color:var(--dark)}
.btn-green{background:var(--green);color:#fff}
.btn-light{background:#fff;color:var(--green);border-color:var(--line)}
.btn-red{background:#fff0f0;color:#a12626;border-color:#f3c9c9}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px;box-shadow:0 8px 25px #0000000d}
label{display:block;font-weight:800;margin:0 0 6px}
input,select,textarea{width:100%;border:1px solid #d7dde5;border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(35,65,138,.12)}
.row{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.msg{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;font-weight:800;text-align:center}
.msg.show{display:block}
.msg.ok{background:#e9f8ef;color:#176b3a}
.msg.err{background:#fff0f0;color:#a12626}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tab{padding:9px 16px;border-radius:30px;background:#fff;border:1px solid var(--line);font-weight:800;cursor:pointer}
.tab.active{background:var(--green);color:#fff;border-color:var(--green)}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid var(--line);padding:9px;text-align:right;font-size:14px}
th{background:#F3F6FC;font-weight:800}
td.actions{white-space:nowrap;text-align:center}
.off{opacity:.5}
.center{text-align:center}
#login{max-width:420px;margin:60px auto}
#panel{display:none;padding-bottom:60px}
.chip{display:inline-block;background:#EAF1FF;color:var(--green);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:800}
</style>
</head>
<body>

<header><div class="container">
  <h1>لوحة تعديل عروض همسه</h1>
  <button class="btn btn-light" id="logout" style="display:none">خروج</button>
</div></header>

<div class="container">

  <div id="login" class="card">
    <h2 style="margin-top:0">تسجيل الدخول</h2>
    <div class="row">
      <label>مفتاح الدخول</label>
      <input type="password" id="key" placeholder="اكتب المفتاح السري">
      <div class="hint">هو نفس قيمة ADMIN_KEY الموجودة في كود Apps Script.</div>
    </div>
    <button class="btn btn-gold" style="width:100%" id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel">
    <div class="tabs">
      <div class="tab active" data-sec="umrah">برامج العمرة</div>
      <div class="tab" data-sec="hajj">برامج الحج</div>
      <div class="tab" data-sec="cash">كاش اقتصادي</div>
      <div class="tab" data-sec="cash5">كاش 5 نجوم</div>
    </div>

    <div class="card">
      <h2 style="margin-top:0" id="formTitle">إضافة عرض جديد</h2>
      <input type="hidden" id="offerId">

      <div class="grid2">
        <div class="row">
          <label>القسم</label>
          <select id="section">
            <option value="umrah">برامج العمرة</option>
            <option value="hajj">برامج الحج</option>
            <option value="cash">كاش اقتصادي</option>
            <option value="cash5">كاش 5 نجوم</option>
          </select>
        </div>
        <div class="row">
          <label>اسم العرض</label>
          <input id="title" placeholder="مثال: عمرة التيسير الذهبية">
        </div>
      </div>

      <div class="row">
        <label id="itemsLabel">تفاصيل العرض</label>
        <textarea id="items" rows="5" placeholder="كل سطر = نقطة مستقلة"></textarea>
        <div class="hint" id="itemsHint">اكتب كل نقطة في سطر مستقل.</div>
      </div>

      <div class="row">
        <label id="priceLabelTxt">السعر</label>
        <textarea id="price" rows="4"></textarea>
        <div class="hint" id="priceHint"></div>
      </div>

      <div class="grid3">
        <div class="row" id="styleRow">
          <label>لون الكارت</label>
          <select id="badge">
            <option value="">أزرق (افتراضي)</option>
            <option value="ramadan">رمضان</option>
            <option value="purple">أزرق فاتح</option>
            <option value="gold-card">ذهبي</option>
          </select>
        </div>
        <div class="row" id="imageRow">
          <label>صورة الكارت</label>
          <input id="image" placeholder="kaaba.jpg">
          <div class="hint">اسم ملف صورة في نفس فولدر الموقع أو رابط كامل.</div>
        </div>
        <div class="row" id="subtitleRow">
          <label>نص الزرار / سطر إضافي</label>
          <input id="subtitle" placeholder="استفسر عن التفاصيل">
        </div>
      </div>

      <div class="grid2">
        <div class="row">
          <label>ترتيب الظهور</label>
          <input id="order" type="number" value="1" min="1">
        </div>
        <div class="row">
          <label>الحالة</label>
          <select id="active"><option value="نعم">ظاهر في الموقع</option><option value="لا">مخفي</option></select>
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-gold" id="saveBtn">حفظ العرض</button>
        <button class="btn btn-light" id="cancelBtn" style="display:none">إلغاء التعديل</button>
      </div>
      <div class="msg" id="formMsg"></div>
    </div>

    <div class="card">
      <h2 style="margin-top:0">العروض الحالية <span class="chip" id="secName">برامج العمرة</span></h2>
      <div id="listWrap"><p class="center">جاري التحميل...</p></div>
    </div>
  </div>

</div>

<script>
(function(){
  /* ====== غيّر الرابط ده لو نشرت نسخة جديدة من Apps Script ====== */
  var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw_cCB2H9ndKYBI0XWhOO-mYdD7en91v1y9SezPU3qJE64aAXhtbH54pMdTuSpUCTA7nA/exec';

  var KEY='', allOffers=[], currentSection='umrah';
  var $ = function(id){ return document.getElementById(id); };

  var SEC_NAMES = {umrah:'برامج العمرة',hajj:'برامج الحج',cash:'كاش اقتصادي',cash5:'كاش 5 نجوم'};

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function show(el,kind,text){ el.className='msg show '+kind; el.textContent=text; }
  function hide(el){ el.className='msg'; }

  /* ====== تسجيل الدخول ====== */
  function login(k){
    show($('loginMsg'),'','جاري التحقق...');
    fetch(SCRIPT_URL+'?action=offersAdmin&key='+encodeURIComponent(k))
      .then(function(r){return r.json();})
      .then(function(d){
        if(d && d.ok){
          KEY=k;
          try{ localStorage.setItem('hamsa_admin_key',k); }catch(e){}
          $('login').style.display='none';
          $('panel').style.display='block';
          $('logout').style.display='inline-block';
          allOffers = d.offers||[];
          renderList();
        }else{
          show($('loginMsg'),'err',(d&&d.error)||'مفتاح غير صحيح');
        }
      })
      .catch(function(){ show($('loginMsg'),'err','تعذر الاتصال بالسيرفر. راجع رابط النشر.'); });
  }

  $('loginBtn').addEventListener('click',function(){
    var k=$('key').value.trim();
    if(!k){ show($('loginMsg'),'err','اكتب المفتاح أولاً'); return; }
    login(k);
  });
  $('key').addEventListener('keydown',function(e){ if(e.key==='Enter') $('loginBtn').click(); });

  $('logout').addEventListener('click',function(){
    try{ localStorage.removeItem('hamsa_admin_key'); }catch(e){}
    location.reload();
  });

  function reload(){
    return fetch(SCRIPT_URL+'?action=offersAdmin&key='+encodeURIComponent(KEY))
      .then(function(r){return r.json();})
      .then(function(d){ if(d&&d.ok){ allOffers=d.offers||[]; renderList(); } });
  }

  /* ====== التبويبات ====== */
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    t.addEventListener('click',function(){
      document.querySelector('.tab.active').classList.remove('active');
      t.classList.add('active');
      currentSection=t.getAttribute('data-sec');
      $('secName').textContent=SEC_NAMES[currentSection];
      $('section').value=currentSection;
      applySectionHints();
      resetForm();
      renderList();
    });
  });

  /* ====== شرح الحقول حسب القسم ====== */
  function applySectionHints(){
    var s=$('section').value;
    var isCash = (s==='cash'||s==='cash5');
    $('styleRow').style.display = (s==='umrah')?'block':'none';
    $('imageRow').style.display = (s==='umrah')?'block':'none';
    $('subtitleRow').style.display = (s==='hajj'||isCash)?'block':'none';

    if(isCash){
      $('itemsLabel').textContent='بيانات الفنادق والطيران';
      $('itemsHint').textContent='كل سطر يظهر كسطر مستقل، مثال: مكة: الماسة جراند — 5 ليالي';
      $('priceLabelTxt').textContent='جدول الأسعار';
      $('priceHint').textContent='كل سطر بالشكل: نوع الغرفة : السعر — مثال: رباعي : 47,000';
      $('price').rows=6;
      $('subtitleRow').querySelector('label').textContent='سطر إضافي (اختياري)';
    }else if(s==='hajj'){
      $('itemsLabel').textContent='مميزات البرنامج';
      $('itemsHint').textContent='كل ميزة في سطر مستقل.';
      $('priceLabelTxt').textContent='السعر (غير مستخدم في الحج)';
      $('priceHint').textContent='سيبه فاضي.';
      $('subtitleRow').querySelector('label').textContent='نص الزرار';
    }else{
      $('itemsLabel').textContent='تفاصيل البرنامج';
      $('itemsHint').textContent='كل نقطة في سطر مستقل.';
      $('priceLabelTxt').textContent='الشريط السفلي للسعر';
      $('priceHint').textContent='مثال: ابدأ من 1,000 جنيه';
      $('price').rows=2;
    }
  }
  $('section').addEventListener('change',applySectionHints);

  /* ====== الجدول ====== */
  function renderList(){
    var list = allOffers.filter(function(o){ return o.section===currentSection; })
                        .sort(function(a,b){ return a.order-b.order; });
    if(!list.length){ $('listWrap').innerHTML='<p class="center">لا يوجد عروض في هذا القسم بعد.</p>'; return; }
    var rows = list.map(function(o){
      return '<tr class="'+(o.active==='نعم'?'':'off')+'">'+
        '<td>'+o.order+'</td>'+
        '<td><b>'+esc(o.title)+'</b><div class="hint">'+esc((o.items||[]).join(' • ').slice(0,90))+'</div></td>'+
        '<td>'+esc(o.active)+'</td>'+
        '<td class="actions">'+
          '<button class="btn btn-green" data-edit="'+o.id+'">تعديل</button> '+
          '<button class="btn btn-red" data-del="'+o.id+'">حذف</button>'+
        '</td></tr>';
    }).join('');
    $('listWrap').innerHTML='<table><tr><th>الترتيب</th><th>العرض</th><th>الحالة</th><th>إجراء</th></tr>'+rows+'</table>';

    Array.prototype.forEach.call($('listWrap').querySelectorAll('[data-edit]'),function(b){
      b.addEventListener('click',function(){ editOffer(b.getAttribute('data-edit')); });
    });
    Array.prototype.forEach.call($('listWrap').querySelectorAll('[data-del]'),function(b){
      b.addEventListener('click',function(){ delOffer(b.getAttribute('data-del')); });
    });
  }

  /* ====== نموذج الإضافة/التعديل ====== */
  function resetForm(){
    $('offerId').value=''; $('title').value=''; $('items').value=''; $('price').value='';
    $('subtitle').value=''; $('image').value=''; $('badge').value=''; $('order').value='1';
    $('active').value='نعم';
    $('formTitle').textContent='إضافة عرض جديد';
    $('cancelBtn').style.display='none';
    hide($('formMsg'));
  }
  $('cancelBtn').addEventListener('click',resetForm);

  function editOffer(id){
    var o = allOffers.filter(function(x){return x.id===id;})[0];
    if(!o) return;
    $('offerId').value=o.id;
    $('section').value=o.section; currentSection=o.section; applySectionHints();
    $('title').value=o.title;
    $('items').value=(o.items||[]).join('\n');
    $('price').value=String(o.price||'').split('|').join('\n');
    $('subtitle').value=o.subtitle||'';
    $('image').value=o.image||'';
    $('badge').value=o.badge||'';
    $('order').value=o.order||1;
    $('active').value=(o.active==='نعم')?'نعم':'لا';
    $('formTitle').textContent='تعديل: '+o.title;
    $('cancelBtn').style.display='inline-block';
    window.scrollTo({top:0,behavior:'smooth'});
  }

  function linesToPipe(v){
    return String(v||'').split('\n').map(function(s){return s.trim();}).filter(Boolean).join('|');
  }

  $('saveBtn').addEventListener('click',function(){
    var title=$('title').value.trim();
    if(!title){ show($('formMsg'),'err','اكتب اسم العرض'); return; }

    var id=$('offerId').value.trim();
    var data=new URLSearchParams();
    data.set('action', id?'updateOffer':'addOffer');
    data.set('key', KEY);
    if(id) data.set('id', id);
    data.set('section', $('section').value);
    data.set('title', title);
    data.set('subtitle', $('subtitle').value.trim());
    data.set('items', linesToPipe($('items').value));
    data.set('price', linesToPipe($('price').value));
    data.set('priceLabel','');
    data.set('badge', $('badge').value);
    data.set('image', $('image').value.trim());
    data.set('order', $('order').value||'1');
    data.set('active', $('active').value);

    show($('formMsg'),'','جاري الحفظ...');
    $('saveBtn').disabled=true;
    fetch(SCRIPT_URL,{method:'POST',body:data})
      .then(function(r){return r.json();})
      .then(function(res){
        if(res && res.ok){
          show($('formMsg'),'ok','تم الحفظ بنجاح. حدّث صفحة الموقع لتشوف التغيير.');
          resetForm(); reload();
        }else{
          show($('formMsg'),'err','لم يتم الحفظ: '+((res&&res.error)||'خطأ غير معروف'));
        }
      })
      .catch(function(){ show($('formMsg'),'err','تعذر الاتصال بالسيرفر.'); })
      .finally(function(){ $('saveBtn').disabled=false; });
  });

  function delOffer(id){
    var o = allOffers.filter(function(x){return x.id===id;})[0];
    if(!o) return;
    if(!confirm('متأكد من حذف: '+o.title+' ؟')) return;
    var data=new URLSearchParams();
    data.set('action','deleteOffer'); data.set('key',KEY); data.set('id',id);
    fetch(SCRIPT_URL,{method:'POST',body:data})
      .then(function(r){return r.json();})
      .then(function(res){
        if(res && res.ok){ reload(); }
        else{ alert('لم يتم الحذف: '+((res&&res.error)||'خطأ')); }
      })
      .catch(function(){ alert('تعذر الاتصال بالسيرفر.'); });
  }

  /* دخول تلقائي لو المفتاح متخزن */
  applySectionHints();
  var saved='';
  try{ saved=localStorage.getItem('hamsa_admin_key')||''; }catch(e){}
  if(saved){ $('key').value=saved; login(saved); }
})();
</script>
</body>
</html>
